<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#173f35" />
    <title>МініКафе · Меню</title>
    <link rel="stylesheet" href="/guest.css" />
  </head>
  <body>
    <header>
      <a class="brand" href="/admin" aria-label="МініКафе — вхід працівників"
        >☕ МініКафе</a
      >
    </header>
    <main>
      <div id="guestStatus" role="status">Завантажуємо меню…</div>
      <section id="guestMenu" hidden>
        <div class="guest-identity">
          <label for="guestFullName"
            >Ім’я та прізвище <small>Обов’язково</small></label
          >
          <input
            id="guestFullName"
            type="text"
            autocomplete="name"
            maxlength="100"
            required
            placeholder="Введіть ім’я та прізвище"
            aria-describedby="guestNameError"
            enterkeyhint="done"
          />
          <small id="guestNameError" role="status" hidden></small>
        </div>
        <button id="drinkChoice" class="drink-choice" type="button">
          Вибрати напій <span aria-hidden="true">＋</span>
        </button>
        <div id="chosenDrinks"></div>
        <div id="foodList"></div>
      </section>
    </main>
    <footer id="checkout" hidden>
      <div class="checkout-total">
        <span>Разом <small id="guestCount"></small></span
        ><strong id="guestTotal">0,00 ₴</strong>
      </div>
      <button id="guestSubmit" class="primary" disabled>
        Оформити замовлення
      </button>
    </footer>
    <dialog id="guestDialog" aria-labelledby="guestDialogTitle">
      <div class="dialog-heading">
        <h2 id="guestDialogTitle"></h2>
        <button id="dialogClose" aria-label="Закрити">×</button>
      </div>
      <div id="dialogBody"></div>
      <div id="dialogActions"></div>
    </dialog>
    <script src="/guest.js" defer></script>
  </body>
</html>
